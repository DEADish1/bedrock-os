[package]
name = "bedrock-installer"
version = "0.3.0"
description = "Bedrock OS graphical media installer"
authors = ["Bedrock OS contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "bedrock_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
