name: Documentation
description: Report missing, unclear, or incorrect documentation.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: page
    attributes: {label: Document or page}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What is unclear or incorrect?}
    validations: {required: true}
  - type: textarea
    id: correction
    attributes: {label: Suggested correction}
