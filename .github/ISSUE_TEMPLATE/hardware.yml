name: Hardware compatibility
description: Report a pass or failure on real hardware using privacy-safe identifiers.
title: "[Hardware] "
labels: [hardware]
body:
  - type: input
    id: version
    attributes: {label: Bedrock version and image SHA-256}
    validations: {required: true}
  - type: dropdown
    id: cpu
    attributes: {label: CPU platform, options: [Intel x86-64, AMD x86-64]}
    validations: {required: true}
  - type: textarea
    id: hardware
    attributes: {label: Hardware summary, description: Give public model names only; omit serial numbers and asset tags.}
    validations: {required: true}
  - type: textarea
    id: result
    attributes: {label: Test and result, description: Include the acceptance step, expected result, and observed result.}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed serial numbers, MAC/IP addresses, hostnames, credentials, and personal data.
          required: true
