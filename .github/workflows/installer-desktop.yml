name: Installer desktop

on:
  pull_request:
    paths:
      - ".github/workflows/installer-desktop.yml"
      - "installer/desktop/**"
      - "installer/acceptance/**"
      - "installer/ui/**"
      - "installer/tests/test-desktop-shell.sh"
      - "installer/tests/test-ui-shell.sh"
      - "installer/tests/test-real-device-acceptance.sh"
      - "installer/tests/test-macos-acceptance-preflight.sh"
      - "installer/tests/Test-WindowsAcceptancePreflight.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop and interface contracts
        run: |
          sh installer/tests/test-desktop-shell.sh
          sh installer/tests/test-ui-shell.sh
          sh installer/tests/test-real-device-acceptance.sh

  compile:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils
      - name: Validate macOS disposable-drive preflight
        if: runner.os == 'macOS'
        run: sh installer/tests/test-macos-acceptance-preflight.sh
      - name: Validate Windows disposable-drive preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/tests/Test-WindowsAcceptancePreflight.ps1
      - name: Compile native bridge
        run: cargo test --manifest-path installer/desktop/src-tauri/Cargo.toml
      - name: Compile gated Linux physical writer without running it
        if: runner.os == 'Linux'
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          BEDROCK_ALLOW_EPHEMERAL_KEYS=1 \
            sh os/scripts/generate-development-keys.sh "$work/keys" >/dev/null
          BEDROCK_INSTALLER_TRUST_CERT="$work/keys/DO-NOT-SHIP-development.crt" \
          BEDROCK_REQUIRE_PRODUCTION_TRUST=1 \
          BEDROCK_ENABLE_PHYSICAL_WRITER=I_ACCEPT_REAL_DEVICE_DATA_LOSS \
            cargo check --manifest-path installer/desktop/src-tauri/Cargo.toml --lib
      - name: Compile gated macOS physical writer without running it
        if: runner.os == 'macOS'
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          BEDROCK_ALLOW_EPHEMERAL_KEYS=1 \
            sh os/scripts/generate-development-keys.sh "$work/keys" >/dev/null
          BEDROCK_INSTALLER_TRUST_CERT="$work/keys/DO-NOT-SHIP-development.crt" \
          BEDROCK_REQUIRE_PRODUCTION_TRUST=1 \
          BEDROCK_APPLE_TEAM_ID=BEDROCKCI1 \
          BEDROCK_ENABLE_PHYSICAL_WRITER=I_ACCEPT_REAL_DEVICE_DATA_LOSS \
            cargo check --manifest-path installer/desktop/src-tauri/Cargo.toml --lib
      - name: Compile gated Windows physical writer without running it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $trustCert = Join-Path $env:RUNNER_TEMP "bedrock-physical-writer-ci.crt"
          $rsa = [System.Security.Cryptography.RSA]::Create(3072)
          $certificate = $null
          try {
            $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
              "CN=Bedrock ephemeral CI development key",
              $rsa,
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
            $certificate = $request.CreateSelfSigned(
              [DateTimeOffset]::UtcNow.AddMinutes(-5),
              [DateTimeOffset]::UtcNow.AddDays(7)
            )
            [System.IO.File]::WriteAllText($trustCert, $certificate.ExportCertificatePem())
            $env:BEDROCK_INSTALLER_TRUST_CERT = $trustCert
            $env:BEDROCK_REQUIRE_PRODUCTION_TRUST = "1"
            $env:BEDROCK_ENABLE_PHYSICAL_WRITER = "I_ACCEPT_REAL_DEVICE_DATA_LOSS"
            cargo check --manifest-path installer/desktop/src-tauri/Cargo.toml --lib
          } finally {
            if ($certificate) { $certificate.Dispose() }
            $rsa.Dispose()
            Remove-Item -LiteralPath $trustCert -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/desktop/package-lock.json
      - name: Install pinned desktop packaging tool
        run: npm ci --prefix installer/desktop --ignore-scripts
      - name: Build unsigned Unix preview package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) bundle=deb ;;
            macOS) bundle=dmg ;;
            *) printf 'error: unsupported packaging host\n' >&2; exit 1 ;;
          esac
          npm --prefix installer/desktop run tauri -- build \
            --config src-tauri/tauri.preview.conf.json \
            --bundles "$bundle"
      - name: Build unsigned Windows preview package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application).Source
          if ($perl -like "*\\Git\\usr\\bin\\*") {
            throw "Windows packaging selected Git's incomplete Perl: $perl"
          }
          npm --prefix installer/desktop run tauri -- build `
            --config src-tauri/tauri.preview.conf.json `
            --bundles nsis
      - name: Upload unsigned preview package
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-installer-0.3-preview-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            installer/desktop/PREVIEW-NOTICE.txt
            installer/desktop/src-tauri/target/release/bundle/deb/*.deb
            installer/desktop/src-tauri/target/release/bundle/nsis/*.exe
            installer/desktop/src-tauri/target/release/bundle/dmg/*.dmg
