name: Installer desktop

on:
  pull_request:
    paths:
      - ".github/workflows/installer-desktop.yml"
      - "installer/desktop/**"
      - "installer/acceptance/**"
      - "installer/ui/**"
      - "installer/tests/test-desktop-shell.sh"
      - "installer/tests/test-ui-shell.sh"
      - "installer/tests/test-real-device-acceptance.sh"
      - "installer/tests/test-macos-acceptance-preflight.sh"
      - "installer/tests/Test-WindowsAcceptancePreflight.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop and interface contracts
        run: |
          sh installer/tests/test-desktop-shell.sh
          sh installer/tests/test-ui-shell.sh
          sh installer/tests/test-real-device-acceptance.sh

  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - name: Validate macOS disposable-drive preflight
        if: runner.os == 'macOS'
        run: sh installer/tests/test-macos-acceptance-preflight.sh
      - name: Validate Windows disposable-drive preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/tests/Test-WindowsAcceptancePreflight.ps1
      - name: Compile native bridge
        run: cargo test --manifest-path installer/desktop/src-tauri/Cargo.toml
      - name: Compile gated Linux physical writer without running it
        if: runner.os == 'Linux'
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          BEDROCK_ALLOW_EPHEMERAL_KEYS=1 \
            sh os/scripts/generate-development-keys.sh "$work/keys" >/dev/null
          BEDROCK_INSTALLER_TRUST_CERT="$work/keys/DO-NOT-SHIP-development.crt" \
          BEDROCK_REQUIRE_PRODUCTION_TRUST=1 \
          BEDROCK_ENABLE_PHYSICAL_WRITER=I_ACCEPT_REAL_DEVICE_DATA_LOSS \
            cargo check --manifest-path installer/desktop/src-tauri/Cargo.toml --lib
      - name: Compile gated Windows physical writer without running it
        if: runner.os == 'Windows'
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          MSYS2_ARG_CONV_EXCL='/CN=*' BEDROCK_ALLOW_EPHEMERAL_KEYS=1 \
            sh os/scripts/generate-development-keys.sh "$work/keys" >/dev/null
          trust_cert=$(cygpath -w "$work/keys/DO-NOT-SHIP-development.crt")
          BEDROCK_INSTALLER_TRUST_CERT="$trust_cert" \
          BEDROCK_REQUIRE_PRODUCTION_TRUST=1 \
          BEDROCK_ENABLE_PHYSICAL_WRITER=I_ACCEPT_REAL_DEVICE_DATA_LOSS \
            cargo check --manifest-path installer/desktop/src-tauri/Cargo.toml --lib
