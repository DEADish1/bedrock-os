name: Diagnose ISO reproducibility

on:
  push:
    branches: [codex/reproducible-iso-fix]
    paths: ['.github/workflows/diagnose-reproducibility.yml']

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends initramfs-tools-core squashfs-tools xorriso
      - uses: actions/download-artifact@v4
        with:
          name: bedrock-os-amd64-1
          path: build-a
          repository: DEADish1/bedrock-os
          run-id: 32640190700
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: bedrock-os-amd64-2
          path: build-b
          repository: DEADish1/bedrock-os
          run-id: 32640190700
          github-token: ${{ github.token }}
      - name: Report remaining differences
        run: |
          set -eu
          sha256sum build-a/bedrock-os-amd64.iso build-b/bedrock-os-amd64.iso
          diff -u build-a/bedrock-build-manifest.json build-b/bedrock-build-manifest.json || true
          diff -u build-a/packages.lock build-b/packages.lock || true
          mkdir iso-a iso-b
          xorriso -indev build-a/bedrock-os-amd64.iso -pvd_info 2>&1 | tee pvd-a.txt
          xorriso -indev build-b/bedrock-os-amd64.iso -pvd_info 2>&1 | tee pvd-b.txt
          diff -u pvd-a.txt pvd-b.txt || true
          xorriso -osirrox on -indev build-a/bedrock-os-amd64.iso -extract / iso-a >/dev/null 2>&1
          xorriso -osirrox on -indev build-b/bedrock-os-amd64.iso -extract / iso-b >/dev/null 2>&1
          (cd iso-a && find . -type f -print0 | sort -z | xargs -0 sha256sum) > files-a.sha256
          (cd iso-b && find . -type f -print0 | sort -z | xargs -0 sha256sum) > files-b.sha256
          diff -u files-a.sha256 files-b.sha256 | head -400 || true
      - name: Compare compressed root filesystems
        run: |
          set -eu
          unsquashfs -quiet -dest root-a iso-a/live/filesystem.squashfs
          unsquashfs -quiet -dest root-b iso-b/live/filesystem.squashfs
          (cd root-a && find . -type f -print0 | sort -z | xargs -0 sha256sum) > root-a.sha256
          (cd root-b && find . -type f -print0 | sort -z | xargs -0 sha256sum) > root-b.sha256
          echo 'Content differences inside filesystem.squashfs:'
          diff -u root-a.sha256 root-b.sha256 | head -800 || true
          (cd root-a && find . -printf '%P|%y|%m|%U|%G|%T@|%l\n' | sort) > root-a.metadata
          (cd root-b && find . -printf '%P|%y|%m|%U|%G|%T@|%l\n' | sort) > root-b.metadata
          echo 'Metadata differences inside filesystem.squashfs:'
          diff -u root-a.metadata root-b.metadata | head -1200 || true
      - name: Compare initramfs images
        run: |
          set -eu
          initrd_a=$(find iso-a/live -maxdepth 1 -type f -name 'initrd.img-*' -print -quit)
          initrd_b=$(find iso-b/live -maxdepth 1 -type f -name 'initrd.img-*' -print -quit)
          mkdir initrd-a initrd-b
          unmkinitramfs "$initrd_a" initrd-a
          unmkinitramfs "$initrd_b" initrd-b
          (cd initrd-a && find . -type f -print0 | sort -z | xargs -0 sha256sum) > initrd-a.sha256
          (cd initrd-b && find . -type f -print0 | sort -z | xargs -0 sha256sum) > initrd-b.sha256
          echo 'Content differences inside initramfs:'
          diff -u initrd-a.sha256 initrd-b.sha256 | head -800 || true
          (cd initrd-a && find . -printf '%P|%y|%m|%U|%G|%T@|%l\n' | sort) > initrd-a.metadata
          (cd initrd-b && find . -printf '%P|%y|%m|%U|%G|%T@|%l\n' | sort) > initrd-b.metadata
          echo 'Metadata differences inside initramfs:'
          diff -u initrd-a.metadata initrd-b.metadata | head -1200 || true
