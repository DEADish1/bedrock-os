search --set=root --file /live/vmlinuz
set default=0
set timeout=10

menuentry "Install Bedrock Server OS" {
    linux /live/vmlinuz boot=live components hostname=bedrock username=bedrock quiet
    initrd /live/initrd.img
}

menuentry "Try Bedrock — live hardware test (no disk changes)" {
    linux /live/vmlinuz boot=live components hostname=bedrock-live username=bedrock bedrock.mode=hardware-test
    initrd /live/initrd.img
}
