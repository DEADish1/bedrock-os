worker_processes 1;
pid /run/bedrock-web/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    client_body_temp_path /run/bedrock-web/body;
    proxy_temp_path /run/bedrock-web/proxy;
    fastcgi_temp_path /run/bedrock-web/fastcgi;
    uwsgi_temp_path /run/bedrock-web/uwsgi;
    scgi_temp_path /run/bedrock-web/scgi;
    limit_conn_zone $binary_remote_addr zone=bedrock_clients:1m;
    map $http_host $bedrock_host_ok {
        default 0;
        "127.0.0.1:8443" 1;
        "localhost:8443" 1;
    }
    map $http_origin $bedrock_origin_ok {
        default 0;
        "" 1;
        "https://127.0.0.1:8443" 1;
        "https://localhost:8443" 1;
    }
    map $http_sec_fetch_site $bedrock_site_ok {
        default 0;
        "" 1;
        "none" 1;
        "same-origin" 1;
    }
    map $http_upgrade $bedrock_connection {
        default close;
        "websocket" upgrade;
    }
    upstream bedrock_api { server unix:/run/bedrock-api/api.sock; }
    server {
        listen 127.0.0.1:8443 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate "@@CREDENTIALS_DIRECTORY@@/tls-cert";
        ssl_certificate_key "@@CREDENTIALS_DIRECTORY@@/tls-key";
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        limit_conn bedrock_clients 16;
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        if ($bedrock_host_ok = 0) { return 421; }
        if ($bedrock_origin_ok = 0) { return 403; }
        if ($bedrock_site_ok = 0) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
        root /usr/share/bedrock/management-ui;
        location ~ "^/api/v1/images/[a-z][a-z0-9-]{0,30}[a-z0-9]/upload$" {
            client_max_body_size 4096g;
            include /etc/bedrock/web-proxy.conf;
        }
        location ~ "^/api/v1/vms/[a-z][a-z0-9-]{0,30}[a-z0-9]/console$" {
            include /etc/bedrock/web-proxy.conf;
            proxy_read_timeout 3600s;
        }
        location /api/v1/ {
            include /etc/bedrock/web-proxy.conf;
        }
        location = /build-manifest.json { return 404; }
        location ~ /\. { return 404; }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
            index index.html;
        }
    }
}
